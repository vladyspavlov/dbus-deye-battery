name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor; Venus OS v3.6x/v3.7x ship 3.8-3.12 depending on
        # release, and the GX this was developed against runs 3.12.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      # The installer tests build a throwaway fake Venus OS and run the real
      # bootstrap inside it.  Without these they skip, which would quietly
      # stop covering the one file people run as root on live hardware.
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap dash
      - run: pytest -q

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check shell scripts parse
        run: |
          for f in install/install.sh install/uninstall.sh install/rc.local \
                   install/bootstrap.sh install/detect-can-interface.sh \
                   install/service/run install/service/log/run \
                   install/service/handoff-can-owner \
                   install/service/rollback-can-owner \
                   tests/gxsim/gx-sandbox.sh; do
            sh -n "$f" && echo "ok: $f"
          done
