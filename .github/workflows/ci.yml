name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor; Venus OS v3.6x/v3.7x ship 3.8-3.12 depending on
        # release, and the GX this was developed against runs 3.12.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      # The installer tests build a throwaway fake Venus OS and run the real
      # bootstrap inside it.  Without these they skip, which would quietly
      # stop covering the one file people run as root on live hardware, so
      # GX_SANDBOX_REQUIRED below turns a skip into a failure.
      - name: Install the sandbox the installer tests run in
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap dash
          # Ubuntu 24.04 restricts unprivileged user namespaces by default,
          # which is what the sandbox is built out of.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          echo "--- what this host will grant"
          for c in "--unshare-all" \
                   "--unshare-user --unshare-ipc --unshare-pid --unshare-uts" \
                   "--unshare-user --unshare-pid" "--unshare-user"; do
            if bwrap $c --uid 0 --gid 0 --ro-bind /usr /usr --ro-bind /bin /bin \
               --ro-bind-try /lib /lib --ro-bind-try /lib64 /lib64 \
               /usr/bin/true 2>/dev/null; then echo "ok:   $c"; else echo "no:   $c"; fi
          done
      - run: GX_SANDBOX_REQUIRED=1 pytest -q

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check shell scripts parse
        # Same entry point as `sh tools/preflight.sh` locally, so the list of
        # scripts cannot drift between here and a developer's machine.
        run: sh tools/preflight.sh --shell
