name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor; Venus OS v3.6x/v3.7x ship 3.8-3.12 depending on
        # release, and the GX this was developed against runs 3.12.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check shell scripts parse
        run: |
          for f in install/install.sh install/uninstall.sh install/rc.local \
                   install/service/run install/service/log/run \
                   install/service/handoff-can-owner \
                   install/service/rollback-can-owner; do
            sh -n "$f" && echo "ok: $f"
          done
